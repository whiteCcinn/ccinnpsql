name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: postgres-versions
    attributes:
      label: PostgreSQL versions where you need it
      placeholder: "e.g. 13 and 17"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
