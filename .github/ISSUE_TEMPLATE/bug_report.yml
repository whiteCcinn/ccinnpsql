name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** include passwords or connection strings with credentials.
        Security issues should be reported privately (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Open table …
        3. …
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: CcinnPsql version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: postgres-version
    attributes:
      label: PostgreSQL version and setup (direct, PgBouncer/Pgpool, managed service, extensions)
      placeholder: "17.2 behind PgBouncer 1.24 (transaction pooling), TimescaleDB 2.17"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac type
      placeholder: "macOS 15.2, Apple silicon"
  - type: textarea
    id: logs
    attributes:
      label: Error messages or screenshots
      description: Include the SQLSTATE if one is shown.
